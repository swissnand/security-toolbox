name: macOS DMG bauen

# Startet bei neuer Version in package.json, bei Tags (v*) oder manuell im Actions-Tab
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version auslesen
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: DMG bauen (Universal – Apple Silicon + Intel)
        run: npx electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: DMG als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: Infosphera-Security-Toolbox-dmg
          path: dist/*.dmg

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Infosphera Security Toolbox v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## Infosphera Security Toolbox v${{ steps.ver.outputs.version }}

            **Download:** `Infosphera-Security-Toolbox-*-universal.dmg` unten bei *Assets* – läuft auf Apple Silicon und Intel.

            > Beim ersten Start: Rechtsklick auf die App → **Öffnen** (die App ist nicht von Apple notarisiert).
